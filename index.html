<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Monkey and Hunter Experiment</title>
    <!-- Force Apple engines to unlock camera rendering arrays -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <!-- Stable framework versions -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
      #ios-bypass-btn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 20px 40px; font-size: 24px; font-weight: bold; background: #27ae60;
        color: white; border: none; border-radius: 10px; z-index: 9999; cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
  </head>
  
  <body>

    <!-- Native Interaction Gate required by iOS -->
    <button id="ios-bypass-btn" onclick="initAREngine()">START AR SESSION</button>

    <!-- Embedded configuration telling AR.js to play explicitly inline -->
    <a-scene id="ar-scene" style="display: none;" embedded arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;">
      
      <!-- Physics Elements -->
      <a-box id="hunter" position="-1 0 -3" color="#27ae60" scale="0.2 0.2 0.2"></a-box>
      <a-sphere id="monkey" position="1 1.5 -3" color="#e74c3c" radius="0.15"></a-sphere>
      <a-sphere id="bullet" position="-1 0 -3" color="#3498db" radius="0.05" visible="false"></a-sphere>
      
      
      
    </a-scene>

    <script>
      const g = 9.8;
      const launchSpeed = 6.0;

      const scene = document.getElementById('ar-scene');
      const bypassBtn = document.getElementById('ios-bypass-btn');
      const monkey = document.getElementById('monkey');
      const bullet = document.getElementById('bullet');
      const aimLine = document.getElementById('aim-line');

      const hPos = { x: -1, y: 0, z: -3 };
      const mPos = { x: 1, y: 1.5, z: -3 };

      let isPlaying = false;
      let startTime = 0;

      function initAREngine() {
        // Hide button, unhide canvas scene container
        bypassBtn.style.display = 'none';
        scene.style.display = 'block';

        // Core Fix: Locate the background <video> tag created by AR.js and force-unmute/play inline
        setTimeout(() => {
          const videoElement = document.querySelector('video');
          if (videoElement) {
            videoElement.setAttribute('playsinline', '');
            videoElement.setAttribute('webkit-playsinline', '');
            videoElement.setAttribute('muted', '');
            videoElement.play().catch(err => {
              console.log("Auto-play bypassed dynamically");
            });
          }
        }, 300); // 300ms delay ensures AR.js has generated the video DOM element

        // Force the underlying canvas to register clicks properly
        window.addEventListener('click', handleScreenTap);
      }

      function handleScreenTap() {
        if (isPlaying) { resetExperiment(); return; }
        startExperiment();
      }

      function startExperiment() {
        isPlaying = true;
        startTime = performance.now();
        bullet.setAttribute('visible', 'true');
        aimLine.setAttribute('visible', 'false');

        const dx = mPos.x - hPos.x;
        const dy = mPos.y - hPos.y;
        const dz = mPos.z - hPos.z;
        const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

        const vx = (dx / distance) * launchSpeed;
        const vy = (dy / distance) * launchSpeed;
        const vz = (dz / distance) * launchSpeed;

        function updatePhysics() {
          if (!isPlaying) return;
          const t = (performance.now() - startTime) / 1000;

          const monkeyY = mPos.y - (0.5 * g * t * t);
          const bulletX = hPos.x + (vx * t);
          const bulletY = hPos.y + (vy * t) - (0.5 * g * t * t);
          const bulletZ = hPos.z + (vz * t);

          monkey.setAttribute('position', `${mPos.x} ${monkeyY} ${mPos.z}`);
          bullet.setAttribute('position', `${bulletX} ${bulletY} ${bulletZ}`);

          if (bulletX >= mPos.x) {
            isPlaying = false;
            alert(`DIRECT HIT!\nBoth shapes collided in mid-air at elevation Y: ${bulletY.toFixed(2)}m.\nThis confirms horizontal components do not limit gravitational acceleration!`);
            return;
          }

          if (monkeyY < -3 || bulletY < -3) { isPlaying = false; return; }
          requestAnimationFrame(updatePhysics);
        }
        requestAnimationFrame(updatePhysics);
      }

      function resetExperiment() {
        isPlaying = false;
        monkey.setAttribute('position', `${mPos.x} ${mPos.y} ${mPos.z}`);
        bullet.setAttribute('position', `${hPos.x} ${hPos.y} ${hPos.z}`);
        bullet.setAttribute('visible', 'false');
        aimLine.setAttribute('visible', 'true');
      }
    </script>
  </body>
</html>
