<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Monkey and Hunter - 4x4 Responsive Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        alert("CRASH DETECTED!\nError: " + message + "\nLine: " + lineno);
        return true;
      };
    </script>

    <style>
      /* Corrected layout to prevent vertical clipping on smaller viewports */
      body { 
        margin: 0; 
        padding: 10px; 
        background-color: #1e272e; 
        font-family: system-ui, sans-serif; 
        color: white; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        min-height: 100vh; 
        box-sizing: border-box; 
        justify-content: flex-start; 
      }
      
      /* Viewport height caps (65vh) guarantee layout fits on standard screens */
      #ui-container, #canvas-wrapper, #settings-panel { 
        width: 100%; 
        max-width: min(92vw, 65vh); 
        box-sizing: border-box; 
      }
      
      #ui-container { 
        display: flex; 
        justify-content: space-between; 
        background: #2f3640; 
        padding: 12px; 
        border-radius: 10px; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        margin-bottom: 8px; 
      }
      .data-box { text-align: center; font-size: 13px; }
      .data-val { font-size: 18px; font-weight: bold; color: #00a8ff; margin-top: 3px; }
      
      #canvas-wrapper { 
        background: #000; 
        border-radius: 10px; 
        border: 2px solid #485460; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        overflow: hidden; 
        position: relative; 
      }
      canvas { 
        display: block; 
        width: 100%; 
        height: auto; 
        aspect-ratio: 1 / 1; 
        touch-action: none; 
        cursor: grab; 
      }
      canvas:active { cursor: grabbing; }
      
      #settings-panel { 
        background: #2f3640; 
        padding: 12px; 
        border-radius: 10px; 
        margin-top: 10px; 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 15px; 
      }
      .slider-group { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; }
      .slider-group label { display: flex; justify-content: space-between; margin-bottom: 5px; color: #dcdde1; }
      input[type=range] { width: 100%; accent-color: #00a8ff; cursor: pointer; }
      
      #controls { margin-top: 15px; display: flex; gap: 10px; }
      button { padding: 12px 35px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 25px; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
      #fire-btn { background-color: #4cd137; }
      #fire-btn:active { transform: scale(0.95); }
      #slow-btn { background-color: #718093; }
      #slow-btn.active { background-color: #e1b12c; }

      @media (max-width: 500px) {
        #settings-panel {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>

    <!-- Telemetry Readout Dashboard -->
    <div id="ui-container">
      <div class="data-box">Time Elapsed<div id="val-t" class="data-val">0.00s</div></div>
      <div class="data-box">Monkey Height (Y)<div id="val-my" class="data-val">3.50m</div></div>
      <div class="data-box">Bullet Height (Y)<div id="val-by" class="data-val">0.50m</div></div>
      <div class="data-box">Status<div id="val-status" class="data-val" style="color:#4cd137;">Ready</div></div>
    </div>

    <!-- Main Workspace Canvas -->
    <div id="canvas-wrapper">
      <canvas id="paintCanvas" width="900" height="900"></canvas>
    </div>

    <!-- Configuration Controllers Panel -->
    <div id="settings-panel">
      <div class="slider-group">
        <label>Firing Speed: <span id="lbl-speed" style="color:#00a8ff;">15 m/s</span></label>
        <input type="range" id="sld-speed" min="8" max="30" value="15" step="1" oninput="updateSliders()">
      </div>
      <div class="slider-group">
        <label>Monkey (X): <span id="lbl-dist" style="color:#f39c12;">3.5 m</span></label>
        <input type="range" id="sld-dist" min="1.0" max="4.0" value="3.5" step="0.1" oninput="updateSliders()">
      </div>
      <div class="slider-group">
        <label>Monkey (Y): <span id="lbl-height" style="color:#e74c3c;">3.5 m</span></label>
        <input type="range" id="sld-height" min="1.0" max="4.0" value="3.5" step="0.1" oninput="updateSliders()">
      </div>
    </div>

    <!-- Primary Control Array -->
    <div id="controls">
      <button id="fire-btn" onclick="toggleSimulation()">FIRE</button>
      <button id="slow-btn" onclick="toggleSlowMo()">SLOW-MO: OFF</button>
    </div>

    <script>
      let canvas, ctx;
      
      // Real-world physics constants (in meters and seconds)
      const g = 9.8; 

      // Boundary Offsets (Provides padding for coordinate grid drawing to prevent browser edge cutoffs)
      const gridOffsetLeft = 100;    // Generous gap on left side for Y labels
      const gridOffsetBottom = 100;  // Generous gap at bottom for X labels
      const gridOffsetRight = 60;
      const gridOffsetTop = 60;
      
      const barrelLength = 0.3;      // Gun barrel length in meters

      // Coordinates mapping: meters to screen pixels
      function toPixels(x_m, y_m) {
        let px = gridOffsetLeft + (x_m / 4.0) * (900 - gridOffsetLeft - gridOffsetRight);
        let py = (canvas.height - gridOffsetBottom) - (y_m / 4.0) * (900 - gridOffsetTop - gridOffsetBottom);
        return { x: px, y: py };
      }

      // Coordinates mapping: screen pixels to meters
      function toMeters(px, py) {
        let x_m = ((px - gridOffsetLeft) / (900 - gridOffsetLeft - gridOffsetRight)) * 4.0;
        let y_m = (((canvas.height - gridOffsetBottom) - py) / (900 - gridOffsetTop - gridOffsetBottom)) * 4.0;
        return { x: x_m, y: y_m };
      }

      // Target physics variables (in meters)
      let launchVelocity = 15; 
      let timeSpeedScale = 1.0; 

      // Positions in real world METERS
      let h_m = { x: 0.5, y: 0.5 };
      let monkey_start_m = { x: 3.5, y: 3.5 };
      
      let monkey_m = { x: 3.5, y: 3.5 }; 
      let bullet_m = { x: 0.5, y: 0.5 };

      let isSimulating = false;
      let runtimeElapsed = 0;
      let lastFrameTimestamp = 0;

      let bulletHistory = [];
      let monkeyHistory = [];
      
      let draggedEntity = null; // 'hunter' or 'monkey'

      window.onload = function() {
        canvas = document.getElementById('paintCanvas');
        ctx = canvas.getContext('2d');
        
        setupPointerEvents();
        updateSliders();
      };

      // Math calculating precise muzzle position to launch bullet
      function getMuzzleCoords() {
        const dx = monkey_start_m.x - h_m.x;
        const dy = monkey_start_m.y - h_m.y;
        const angle = Math.atan2(dy, dx);
        return {
          x: h_m.x + barrelLength * Math.cos(angle),
          y: h_m.y + barrelLength * Math.sin(angle),
          angle: angle
        };
      }

      // Handle Mouse/Touch Interaction Dragging
      function setupPointerEvents() {
        canvas.addEventListener('pointerdown', (e) => {
          if (isSimulating) return; // Prevent drag during firing sequence
          
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          
          const x_px = (e.clientX - rect.left) * scaleX;
          const y_px = (e.clientY - rect.top) * scaleY;
          
          const click_coords = toMeters(x_px, y_px);
          
          const distH = Math.hypot(h_m.x - click_coords.x, h_m.y - click_coords.y);
          const distM = Math.hypot(monkey_start_m.x - click_coords.x, monkey_start_m.y - click_coords.y);
          
          if (distH < 0.4) {
            draggedEntity = 'hunter';
          } else if (distM < 0.4) {
            draggedEntity = 'monkey';
          }
        });

        canvas.addEventListener('pointermove', (e) => {
          if (!draggedEntity || isSimulating) return;
          
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          
          const x_px = (e.clientX - rect.left) * scaleX;
          const y_px = (e.clientY - rect.top) * scaleY;
          
          let coords = toMeters(x_px, y_px);
          
          if (draggedEntity === 'hunter') {
            h_m.x = Math.max(0.0, Math.min(monkey_start_m.x - 0.5, coords.x));
            h_m.y = Math.max(0.0, Math.min(4.0, coords.y));
            
            // Re-anchor bullet to new muzzle point
            const muzzle = getMuzzleCoords();
            bullet_m.x = muzzle.x;
            bullet_m.y = muzzle.y;
          } else if (draggedEntity === 'monkey') {
            monkey_start_m.x = Math.max(h_m.x + 0.5, Math.min(4.0, coords.x));
            monkey_start_m.y = Math.max(0.0, Math.min(4.0, coords.y));
            monkey_m.x = monkey_start_m.x;
            monkey_m.y = monkey_start_m.y;
            
            // Sync with settings UI panel
            document.getElementById('sld-dist').value = monkey_start_m.x;
            document.getElementById('sld-height').value = monkey_start_m.y;
            document.getElementById('lbl-dist').innerText = monkey_start_m.x.toFixed(1) + " m";
            document.getElementById('lbl-height').innerText = monkey_start_m.y.toFixed(1) + " m";

            // Re-anchor bullet to new muzzle point
            const muzzle = getMuzzleCoords();
            bullet_m.x = muzzle.x;
            bullet_m.y = muzzle.y;
          }
          
          drawLaboratoryEnvironment();
        });

        canvas.addEventListener('pointerup', () => { draggedEntity = null; });
        canvas.addEventListener('pointerleave', () => { draggedEntity = null; });
      }

      function updateSliders() {
        if (isSimulating) return; 

        launchVelocity = parseFloat(document.getElementById('sld-speed').value);
        document.getElementById('lbl-speed').innerText = launchVelocity + " m/s";

        monkey_start_m.x = parseFloat(document.getElementById('sld-dist').value);
        document.getElementById('lbl-dist').innerText = monkey_start_m.x.toFixed(1) + " m";

        monkey_start_m.y = parseFloat(document.getElementById('sld-height').value);
        document.getElementById('lbl-height').innerText = monkey_start_m.y.toFixed(1) + " m";

        if (h_m.x >= monkey_start_m.x) {
            h_m.x = Math.max(0.0, monkey_start_m.x - 0.5);
        }

        resetSimulationState();
      }

      // Helper function to paint easy-to-read text badges over grid lines
      function drawLabelBadge(text, x, y, color) {
        ctx.save();
        ctx.font = 'bold 15px system-ui, sans-serif';
        const txtWidth = ctx.measureText(text).width;
        
        // Draw pill background
        ctx.fillStyle = 'rgba(26, 26, 26, 0.85)';
        ctx.fillRect(x - txtWidth/2 - 8, y - 13, txtWidth + 16, 24);
        
        // Draw pill border
        ctx.strokeStyle = '#485460';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - txtWidth/2 - 8, y - 13, txtWidth + 16, 24);
        
        // Draw text coordinate data
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y + 4);
        ctx.restore();
      }

      function drawLaboratoryEnvironment() {
        if (!ctx) return; 
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Grid Background (Drawing real meters 0m to 4m with bold axis borders)
        ctx.font = 'bold 20px system-ui, sans-serif';

        // Draw vertical grid lines (X-Axis labels)
        for (let i = 0; i <= 4; i++) {
          let pt1 = toPixels(i, 0);
          let pt2 = toPixels(i, 4);
          
          ctx.beginPath(); 
          ctx.moveTo(pt1.x, pt1.y); 
          ctx.lineTo(pt2.x, pt2.y);
          if (i === 0 || i === 4) {
            ctx.strokeStyle = '#718093'; // Outer layout borders
            ctx.lineWidth = 3;
          } else {
            ctx.strokeStyle = '#2f3542'; // Inner grid divisions
            ctx.lineWidth = 1;
          }
          ctx.stroke();
          
          // Render X coordinates labels underneath grid safely
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.fillText(i + "m", pt1.x, pt1.y + 35);
        }
        
        // Draw horizontal grid lines (Y-Axis labels)
        for (let j = 0; j <= 4; j++) {
          let pt1 = toPixels(0, j);
          let pt2 = toPixels(4, j);
          
          ctx.beginPath(); 
          ctx.moveTo(pt1.x, pt1.y); 
          ctx.lineTo(pt2.x, pt2.y);
          if (j === 0 || j === 4) {
            ctx.strokeStyle = '#718093'; 
            ctx.lineWidth = 3;
          } else {
            ctx.strokeStyle = '#2f3542';
            ctx.lineWidth = 1;
          }
          ctx.stroke();
          
          // Render Y coordinates labels to the left of grid safely
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'right';
          ctx.fillText(j + "m", pt1.x - 20, pt1.y + 7);
        }

        // Convert coordinates from meters to screen viewport pixels
        let h_pt = toPixels(h_m.x, h_m.y);
        let m_pt = toPixels(monkey_m.x, monkey_m.y);
        let b_pt = toPixels(bullet_m.x, bullet_m.y);

        // 2. Flight Path Trajectory Trails
        ctx.fillStyle = 'rgba(0, 168, 255, 0.4)'; 
        bulletHistory.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });

        ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';  
        monkeyHistory.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });

        // 3. Precision Aiming Path Line (Drawn from Muzzle tip to monkey center)
        const muzzle = getMuzzleCoords();
        const muz_pt = toPixels(muzzle.x, muzzle.y);
        if (!isSimulating) {
          ctx.strokeStyle = '#00f3ff';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.beginPath(); ctx.moveTo(muz_pt.x, muz_pt.y); ctx.lineTo(m_pt.x, m_pt.y); ctx.stroke();
          ctx.setLineDash([]);
        }

        // 4. Weapon Assembly Components (Rotates dynamically toward Target)
        ctx.save();
        ctx.translate(h_pt.x, h_pt.y);
        ctx.rotate(muzzle.angle);
        ctx.fillStyle = '#485460';
        const barrelLenPx = barrelLength * (900 - gridOffsetLeft - gridOffsetRight) / 4.0;
        ctx.fillRect(0, -12, barrelLenPx, 24); // Solid gun barrel
        ctx.restore();

        // Mechanical circular hinge base
        ctx.fillStyle = '#1e272e';
        ctx.strokeStyle = '#718093';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(h_pt.x, h_pt.y, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // 5. Falling Target Monkey (Symmetrical target crosshair)
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(m_pt.x, m_pt.y, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(m_pt.x, m_pt.y, 6, 0, Math.PI * 2); ctx.fill();

        // 6. Flying Bullet Projectile (Bright high-visibility blue with neon shadow)
        ctx.save();
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#00f3ff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b_pt.x, b_pt.y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();

        // 7. Render Coordinates Labels inside high-contrast badges
        let bLabelY = b_pt.y + 35;
        if (bullet_m.y < 0.5) bLabelY = b_pt.y - 30; // Shift upward if near ground boundary
        drawLabelBadge(`Bullet: (${bullet_m.x.toFixed(2)}m, ${bullet_m.y.toFixed(2)}m)`, b_pt.x, bLabelY, '#00a8ff');
        
        let mLabelY = m_pt.y - 25;
        if (monkey_m.y > 3.5) mLabelY = m_pt.y + 35; // Shift downward if near ceiling boundary
        drawLabelBadge(`Monkey: (${monkey_m.x.toFixed(2)}m, ${monkey_m.y.toFixed(2)}m)`, m_pt.x, mLabelY, '#e74c3c');

        drawLabelBadge(`Gun: (${h_m.x.toFixed(2)}m, ${h_m.y.toFixed(2)}m)`, h_pt.x, h_pt.y - 32, '#4cd137');

        // Keep HTML dashboard display numbers synchronized
        document.getElementById('val-my').innerText = monkey_m.y.toFixed(2) + "m";
        document.getElementById('val-by').innerText = bullet_m.y.toFixed(2) + "m";
      }

      function toggleSimulation() {
        if (isSimulating || runtimeElapsed > 0) {
          resetSimulationState();
          return;
        }
        startSimulationSequence();
      }

      function startSimulationSequence() {
        isSimulating = true;
        runtimeElapsed = 0;
        bulletHistory = [];
        monkeyHistory = [];
        lastFrameTimestamp = performance.now();
        
        document.getElementById('fire-btn').innerText = "RESET";
        document.getElementById('fire-btn').style.backgroundColor = '#e74c3c';
        document.getElementById('val-status').innerText = "In Flight";
        document.getElementById('val-status').style.color = '#00a8ff';
        
        document.getElementById('sld-speed').disabled = true;
        document.getElementById('sld-dist').disabled = true;
        document.getElementById('sld-height').disabled = true;

        requestAnimationFrame(simulationLoopProcessing);
      }

      function simulationLoopProcessing(currentTimestamp) {
        if (!isSimulating) return;

        let deltaTime = (currentTimestamp - lastFrameTimestamp) / 1000;
        lastFrameTimestamp = currentTimestamp;

        runtimeElapsed += deltaTime * timeSpeedScale;
        let t = runtimeElapsed;

        // Determine starting coordinates mathematically from barrel muzzle
        const muzzle = getMuzzleCoords();
        const dx_m = monkey_start_m.x - h_m.x;
        const dy_m = monkey_start_m.y - h_m.y;
        const targetHypotenuse = Math.sqrt(dx_m*dx_m + dy_m*dy_m);

        const vx_m = (dx_m / targetHypotenuse) * launchVelocity;
        const vy_m = (dy_m / targetHypotenuse) * launchVelocity;

        // Kinematic trajectory equations
        let currentBulletX = muzzle.x + (vx_m * t);
        let currentBulletY = muzzle.y + (vy_m * t) - (0.5 * g * t * t);
        let currentMonkeyY = monkey_start_m.y - (0.5 * g * t * t);

        monkey_m.y = currentMonkeyY;
        bullet_m.x = currentBulletX;
        bullet_m.y = currentBulletY;

        // Store flight tracking traces
        let b_trace = toPixels(bullet_m.x, bullet_m.y);
        let m_trace = toPixels(monkey_m.x, monkey_m.y);
        bulletHistory.push({ x: b_trace.x, y: b_trace.y });
        monkeyHistory.push({ x: m_trace.x, y: m_trace.y });

        // Update Dashboard timer clock
        document.getElementById('val-t').innerText = t.toFixed(2) + "s";

        drawLaboratoryEnvironment();

        // 1. Collision Intersection confirmation
        if ((vx_m > 0 && bullet_m.x >= monkey_m.x) || (vx_m < 0 && bullet_m.x <= monkey_m.x)) {
          isSimulating = false;
          bullet_m.x = monkey_m.x;
          bullet_m.y = monkey_m.y; 
          drawLaboratoryEnvironment();
          
          document.getElementById('val-status').innerText = "HIT!";
          document.getElementById('val-status').style.color = '#4cd137';
          
          alert(`DIRECT HIT!\nFlight time: ${t.toFixed(2)}s.\nBoth items intersected perfectly at an elevation of ${Math.max(0, monkey_m.y).toFixed(2)}m!`);
          return;
        }

        // 2. Ground limit boundaries check
        if (monkey_m.y <= 0 || bullet_m.y <= 0) {
          isSimulating = false;
          document.getElementById('val-status').innerText = "Grounded";
          document.getElementById('val-status').style.color = '#718093';
          alert(`MISSED!\nThe bullet hit the ground before reaching the target. Drag them closer or increase the Firing Speed!`);
          return;
        }

        requestAnimationFrame(simulationLoopProcessing);
      }

      function resetSimulationState() {
        isSimulating = false;
        runtimeElapsed = 0;
        bulletHistory = [];
        monkeyHistory = [];
        
        monkey_m = { x: monkey_start_m.x, y: monkey_start_m.y };
        
        // Spawn bullet precisely resting at muzzle tip
        const muzzle = getMuzzleCoords();
        bullet_m = { x: muzzle.x, y: muzzle.y };
        
        document.getElementById('fire-btn').innerText = "FIRE";
        document.getElementById('fire-btn').style.backgroundColor = '#4cd137';
        document.getElementById('val-status').innerText = "Ready";
        document.getElementById('val-status').style.color = '#4cd137';
        
        document.getElementById('sld-speed').disabled = false;
        document.getElementById('sld-dist').disabled = false;
        document.getElementById('sld-height').disabled = false;

        document.getElementById('val-t').innerText = "0.00s";

        drawLaboratoryEnvironment();
      }

      function toggleSlowMo() {
        const btn = document.getElementById('slow-btn');
        if (timeSpeedScale === 1.0) {
          timeSpeedScale = 0.1;
          btn.innerText = "SLOW-MO: ON";
          btn.classList.add('active');
        } else {
          timeSpeedScale = 1.0;
          btn.innerText = "SLOW-MO: OFF";
          btn.classList.remove('active');
        }
      }
    </script>
  </body>
</html>
