<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Monkey and Hunter - Realistic Scale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        alert("CRASH DETECTED!\nError: " + message + "\nLine: " + lineno);
        return true;
      };
    </script>

    <style>
      body { margin: 0; padding: 0; background-color: #1e272e; font-family: system-ui, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: center; }
      #ui-container { width: 90%; max-width: 800px; display: flex; justify-content: space-between; background: #2f3640; padding: 12px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 8px; box-sizing: border-box; }
      .data-box { text-align: center; font-size: 13px; }
      .data-val { font-size: 18px; font-weight: bold; color: #00a8ff; margin-top: 3px; }
      
      #canvas-wrapper { width: 90%; max-width: 800px; background: #000; border-radius: 10px; border: 2px solid #485460; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
      canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
      
      #settings-panel { width: 90%; max-width: 800px; background: #2f3640; padding: 12px; border-radius: 10px; margin-top: 10px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .slider-group { display: flex; flex-direction: column; font-size: 14px; font-weight: bold; }
      .slider-group label { display: flex; justify-content: space-between; margin-bottom: 5px; color: #dcdde1; }
      input[type=range] { width: 100%; accent-color: #00a8ff; cursor: pointer; }
      
      #controls { margin-top: 15px; display: flex; gap: 10px; }
      button { padding: 12px 35px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 25px; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
      #fire-btn { background-color: #4cd137; }
      #fire-btn:active { transform: scale(0.95); }
      #slow-btn { background-color: #718093; }
      #slow-btn.active { background-color: #e1b12c; }
    </style>
  </head>
  <body>

    <!-- Telemetry Readout Dashboard -->
    <div id="ui-container">
      <div class="data-box">Time Elapsed<div id="val-t" class="data-val">0.00s</div></div>
      <div class="data-box">Monkey Height (Y)<div id="val-my" class="data-val">4.00m</div></div>
      <div class="data-box">Bullet Height (Y)<div id="val-by" class="data-val">0.50m</div></div>
      <div class="data-box">Status<div id="val-status" class="data-val" style="color:#4cd137;">Ready</div></div>
    </div>

    <!-- Main Workspace Canvas -->
    <div id="canvas-wrapper">
      <canvas id="paintCanvas" width="1600" height="900"></canvas>
    </div>

    <!-- Configuration Controllers Panel -->
    <div id="settings-panel">
      <div class="slider-group">
        <!-- Speed scaled down for a realistic 7m horizontal gap -->
        <label>Firing Speed: <span id="lbl-speed" style="color:#00a8ff;">15 m/s</span></label>
        <input type="range" id="sld-speed" min="8" max="30" value="15" step="1" oninput="updateSliders()">
      </div>
      <div class="slider-group">
        <!-- Height strictly capped at 4.0 meters -->
        <label>Monkey Tree Position: <span id="lbl-height" style="color:#e74c3c;">4.0 m</span></label>
        <input type="range" id="sld-height" min="1.0" max="4.0" value="4.0" step="0.1" oninput="updateSliders()">
      </div>
    </div>

    <!-- Primary Control Array -->
    <div id="controls">
      <button id="fire-btn" onclick="toggleSimulation()">FIRE</button>
      <button id="slow-btn" onclick="toggleSlowMo()">SLOW-MO: OFF</button>
    </div>

    <script>
      let canvas, ctx;
      
      // Real-world physics constants (in meters and seconds)
      const g = 9.8; 
      const pxPerMeter = 200; // 1 real meter = 200 screen pixels

      // Target physics variables (in meters)
      let launchVelocity = 15; 
      let timeSpeedScale = 1.0; 
      let monkeyStartHeight = 4.0;

      // Positions in real world METERS
      // Hunter is locked at 0.5m off the ground, Monkey is locked at 7.0m away.
      let h_m = { x: 0.5, y: 0.5 };
      let monkey_m = { x: 7.0, y: 4.0 };  
      let bullet_m = { x: 0.5, y: 0.5 };

      let isSimulating = false;
      let runtimeElapsed = 0;
      let lastFrameTimestamp = 0;

      let bulletHistory = [];
      let monkeyHistory = [];

      window.onload = function() {
        canvas = document.getElementById('paintCanvas');
        ctx = canvas.getContext('2d');
        updateSliders();
      };

      function updateSliders() {
        if (isSimulating) return; 

        launchVelocity = parseFloat(document.getElementById('sld-speed').value);
        document.getElementById('lbl-speed').innerText = launchVelocity + " m/s";

        monkeyStartHeight = parseFloat(document.getElementById('sld-height').value);
        document.getElementById('lbl-height').innerText = monkeyStartHeight.toFixed(1) + " m";

        resetSimulationState();
      }

      function drawLaboratoryEnvironment() {
        if (!ctx) return; 
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Grid Background (Drawing real meters)
        ctx.strokeStyle = '#2c3e50';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#7f8fa6';
        ctx.font = '16px sans-serif';

        // Draw vertical 1-meter lines (X-axis)
        for (let i = 0; i <= 8; i++) {
          let px = i * pxPerMeter;
          ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, canvas.height); ctx.stroke();
          if (px > 0 && px < canvas.width) ctx.fillText(i + "m", px + 8, canvas.height - 10);
        }
        
        // Draw horizontal 1-meter lines (Y-axis)
        for (let j = 0; j <= 4; j++) {
          let py = canvas.height - (j * pxPerMeter);
          ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(canvas.width, py); ctx.stroke();
          if (py > 0 && py < canvas.height) ctx.fillText(j + "m", 10, py - 8);
        }

        // Convert Meters to Pixels for Drawing Objects
        let h_px = h_m.x * pxPerMeter;
        let h_py = canvas.height - (h_m.y * pxPerMeter);
        let m_px = monkey_m.x * pxPerMeter;
        let m_py = canvas.height - (monkey_m.y * pxPerMeter);
        let b_px = bullet_m.x * pxPerMeter;
        let b_py = canvas.height - (bullet_m.y * pxPerMeter);

        // 2. Trajectory Tracking Trails (Drawn in pixels)
        ctx.fillStyle = 'rgba(52, 152, 219, 0.5)'; 
        bulletHistory.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });

        ctx.fillStyle = 'rgba(231, 76, 60, 0.5)';  
        monkeyHistory.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill(); });

        // 3. Aim Line
        if (!isSimulating) {
          ctx.strokeStyle = '#00f3ff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(h_px, h_py);
          ctx.lineTo(m_px, m_py);
          ctx.stroke();
        }

        // 4. Hunter Device
        ctx.fillStyle = '#4cd137';
        ctx.beginPath(); ctx.arc(h_px, h_py, 15, 0, Math.PI * 2); ctx.fill();

        // 5. Monkey Target (Red circle with white center)
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(m_px, m_py, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(m_px, m_py, 5, 0, Math.PI * 2); ctx.fill();

        // 6. Projectile Ball (Always Visible)
        ctx.fillStyle = '#00a8ff';
        ctx.beginPath(); ctx.arc(b_px, b_py, 8, 0, Math.PI * 2); ctx.fill();
      }

      function toggleSimulation() {
        if (isSimulating || runtimeElapsed > 0) {
          resetSimulationState();
          return;
        }
        startSimulationSequence();
      }

      function startSimulationSequence() {
        isSimulating = true;
        runtimeElapsed = 0;
        bulletHistory = [];
        monkeyHistory = [];
        lastFrameTimestamp = performance.now();
        
        document.getElementById('fire-btn').innerText = "RESET";
        document.getElementById('fire-btn').style.backgroundColor = '#e74c3c';
        document.getElementById('val-status').innerText = "In Flight";
        document.getElementById('val-status').style.color = '#00a8ff';
        
        document.getElementById('sld-speed').disabled = true;
        document.getElementById('sld-height').disabled = true;

        requestAnimationFrame(simulationLoopProcessing);
      }

      function simulationLoopProcessing(currentTimestamp) {
        if (!isSimulating) return;

        let deltaTime = (currentTimestamp - lastFrameTimestamp) / 1000;
        lastFrameTimestamp = currentTimestamp;

        runtimeElapsed += deltaTime * timeSpeedScale;
        let t = runtimeElapsed;

        // Vector math in strict meters
        const dx_m = monkey_m.x - h_m.x;
        const dy_m = monkeyStartHeight - h_m.y;
        const targetHypotenuse = Math.sqrt(dx_m*dx_m + dy_m*dy_m);

        const vx_m = (dx_m / targetHypotenuse) * launchVelocity;
        const vy_m = (dy_m / targetHypotenuse) * launchVelocity;

        // Pure real-world kinematic equations
        let currentMonkeyY = monkeyStartHeight - (0.5 * g * t * t);
        let currentBulletX = h_m.x + (vx_m * t);
        let currentBulletY = h_m.y + (vy_m * t) - (0.5 * g * t * t);

        monkey_m.y = currentMonkeyY;
        bullet_m.x = currentBulletX;
        bullet_m.y = currentBulletY;

        // Store pixel coordinates for trails
        bulletHistory.push({ x: bullet_m.x * pxPerMeter, y: canvas.height - (bullet_m.y * pxPerMeter) });
        monkeyHistory.push({ x: monkey_m.x * pxPerMeter, y: canvas.height - (monkey_m.y * pxPerMeter) });

        // Update Dashboard Data
        document.getElementById('val-t').innerText = t.toFixed(2) + "s";
        document.getElementById('val-my').innerText = Math.max(0, monkey_m.y).toFixed(2) + "m";
        document.getElementById('val-by').innerText = Math.max(0, bullet_m.y).toFixed(2) + "m";

        drawLaboratoryEnvironment();

        // 1. Check for Hit (Crossed the horizontal gap)
        if (bullet_m.x >= monkey_m.x) {
          isSimulating = false;
          bullet_m.x = monkey_m.x;
          bullet_m.y = monkey_m.y; 
          drawLaboratoryEnvironment();
          
          document.getElementById('val-status').innerText = "HIT!";
          document.getElementById('val-status').style.color = '#4cd137';
          document.getElementById('val-by').innerText = Math.max(0, monkey_m.y).toFixed(2) + "m";
          
          alert(`DIRECT HIT!\nFlight time: ${t.toFixed(2)}s.\nNotice how both items intersected perfectly at an elevation of ${Math.max(0, monkey_m.y).toFixed(2)}m!`);
          return;
        }

        // 2. Check for Grounding (Fell below 0 meters before crossing)
        if (monkey_m.y <= 0 || bullet_m.y <= 0) {
          isSimulating = false;
          document.getElementById('val-status').innerText = "Grounded";
          document.getElementById('val-status').style.color = '#718093';
          alert(`MISSED!\nThe bullet hit the ground before crossing the distance. Try increasing the Firing Speed!`);
          return;
        }

        requestAnimationFrame(simulationLoopProcessing);
      }

      function resetSimulationState() {
        isSimulating = false;
        runtimeElapsed = 0;
        bulletHistory = [];
        monkeyHistory = [];
        
        monkey_m = { x: 7.0, y: monkeyStartHeight };
        bullet_m = { x: 0.5, y: 0.5 };
        
        document.getElementById('fire-btn').innerText = "FIRE";
        document.getElementById('fire-btn').style.backgroundColor = '#4cd137';
        document.getElementById('val-status').innerText = "Ready";
        document.getElementById('val-status').style.color = '#4cd137';
        
        document.getElementById('sld-speed').disabled = false;
        document.getElementById('sld-height').disabled = false;

        document.getElementById('val-t').innerText = "0.00s";
        document.getElementById('val-my').innerText = monkey_m.y.toFixed(2) + "m";
        document.getElementById('val-by').innerText = "0.50m";

        drawLaboratoryEnvironment();
      }

      function toggleSlowMo() {
        const btn = document.getElementById('slow-btn');
        if (timeSpeedScale === 1.0) {
          timeSpeedScale = 0.1;
          btn.innerText = "SLOW-MO: ON";
          btn.classList.add('active');
        } else {
          timeSpeedScale = 1.0;
          btn.innerText = "SLOW-MO: OFF";
          btn.classList.remove('active');
        }
      }
    </script>
  </body>
</html>
